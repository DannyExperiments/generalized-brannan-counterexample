name: Partial exact-witness Lean check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and replay the exact-witness Lean certificate
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization/lean
          build: true
          leanchecker: true
          use-mathlib-cache: true
      - name: Report theorem axioms
        working-directory: formalization/lean
        run: lake env lean Axioms.lean
